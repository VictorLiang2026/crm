name: CRM modular frontend guard

on:
  push:
  pull_request:

jobs:
  modular-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:modular
      - run: npm run test:backend
